[pytest]
testpaths = src
asyncio_mode = strict
# Fixture'lar test doirasida yashaydi. Ochiq qoldirilsa pytest-asyncio
# ogohlantirish beradi va kelajakdagi versiyada standart o'zgaradi —
# o'shanda testlar sababsiz yiqilardi.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
